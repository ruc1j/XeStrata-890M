# codespell for XeStrata (tools/lint/run.sh): identifiers it would take for misspellings
[codespell]
# serch, pash, bu: the misspelt tool names and the cut word the serve tests feed the parser on purpose
# pres, clen: identifiers of upstream's Inkling-2-Mini engine (the presence penalty, a codec's length)
# sring: the KV trellis's ring (a local accessor, as srow, shost and sml)
ignore-words-list = nd,fo,te,nin,dout,optin,renderd,rcall,caf,espace,aer,thi,fonctions,hsa,edn,serch,pash,bu,crasher,pres,clen,sring
# recorded model output in other languages; the quant yardstick's multilingual prompts (data/quant_quality)
skip = */fixtures/*,*/quant_quality/*/multilingual.txt
